<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(6, 182, 212, 0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- Glowing Radar Circle Effect -->
  <circle cx="650" cy="225" r="180" fill="none" stroke="rgba(6, 182, 212, 0.1)" stroke-width="2"/>
  <circle cx="650" cy="225" r="120" fill="none" stroke="rgba(6, 182, 212, 0.15)" stroke-width="1.5" stroke-dasharray="4,6"/>
  <circle cx="650" cy="225" r="60" fill="none" stroke="rgba(6, 182, 212, 0.2)" stroke-width="1"/>

  <!-- Top Status Bar HUD -->
  <rect x="30" y="25" width="740" height="40" rx="10" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(6, 182, 212, 0.3)" stroke-width="1"/>
  <circle cx="50" cy="45" r="6" fill="#10b981"/>
  <text x="66" y="49" fill="#10b981" font-family="monospace" font-size="12" font-weight="bold">SYSTEM LIVE STREAM</text>
  <text x="750" y="49" fill="#06b6d4" font-family="monospace" font-size="12" font-weight="bold" text-anchor="end">CAM 01 - INTERACTIVE SMARTBOARD</text>

  <!-- Center Graphic Icon Box -->
  <g transform="translate(620, 195) scale(1.8)">
    <rect x="3" y="4" width="18" height="12" rx="2" fill="none" stroke="#6366f1" stroke-width="2"/><path d="M7 20h10M12 16v4" stroke="#6366f1" stroke-width="2"/>
  </g>

  <!-- Content Box Bottom Overlay -->
  <rect x="30" y="310" width="740" height="115" rx="16" fill="rgba(3, 7, 18, 0.85)" stroke="rgba(6, 182, 212, 0.3)" stroke-width="1"/>
  <rect x="30" y="310" width="8" height="115" rx="4" fill="url(#accent)"/>

  <!-- Text Overlay -->
  <text x="55" y="342" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold">Smart Board Interaktif 86" Briefing VTS</text>
  <text x="55" y="368" fill="#94a3b8" font-family="sans-serif" font-size="13">Fasilitas Rapat Evaluasi & Simulasi Alur Laut</text>

  <!-- Bottom Telemetry Specs -->
  <rect x="55" y="385" width="160" height="24" rx="6" fill="rgba(6, 182, 212, 0.15)" stroke="rgba(6, 182, 212, 0.4)"/>
  <text x="135" y="401" fill="#06b6d4" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">STASIUN VTS PANJANG</text>

  <rect x="225" y="385" width="140" height="24" rx="6" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.4)"/>
  <text x="295" y="401" fill="#10b981" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">HD CCTV RECORDED</text>
</svg>